---
- name: DatBoiTim Workstation Setup
  hosts: localhost
  tags:
    - workstation

  tasks:
    - name: Copy new bashrc
      ansible.builtin.copy:
        src: ./files/bashrc.bashrc
        dest: "{{ ansible_env.HOME }}/.bashrc"
      notify:
        - Bashrc changed

    - name: Install neovim with role
      include_role:
        name: role_nvim

    - name: Install rust with role
      include_role:
        name: role_rustup

    - name: Setup git config to use editor nvim
      ansible.builtin.shell: |
        git config --global core.editor "nvim"

    - name: Cleanup js bloat from install
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: 
        - package.json
        - package-lock.json
        - node_modules

  handlers:
    - name: Bashrc changed
      ansible.builtin.debug:
        msg: "Bashrc Changed, please log-out and log back in or run `source ~/.bashrc`"

